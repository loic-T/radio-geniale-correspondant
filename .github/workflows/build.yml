name: Compilation Android et iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Le code du projet est fourni dans projet.zip (un seul fichier à
      # téléverser sur GitHub) : on le décompresse par-dessus le dépôt.
      - name: Décompresser projet.zip
        run: unzip -o -q projet.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=RG_BUILD=${{ github.run_number }}

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk RadioGeniale-Correspondant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RadioGeniale-Correspondant-android
          path: RadioGeniale-Correspondant.apk

      - name: Paquet Play Store (AAB)
        if: env.HAS_KEYSTORE == 'true'
        run: flutter build appbundle --release --dart-define=RG_BUILD=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: RadioGeniale-Correspondant-playstore
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS (vérification de compilation)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser projet.zip
        run: unzip -o -q projet.zip -d .

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      - name: Archiver Runner.app
        run: |
          cd build/ios/iphoneos
          zip -qr ../../../RadioGeniale-Correspondant-ios-non-signe.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: RadioGeniale-Correspondant-ios-non-signe
          path: RadioGeniale-Correspondant-ios-non-signe.zip
