name: Compilation Android et iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # pour publier les Releases (lien de téléchargement)

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # Le code du projet est fourni dans projet.zip (un seul fichier à
      # téléverser sur GitHub) : on le décompresse par-dessus le dépôt.
      - name: Décompresser projet.zip
        run: unzip -o -q projet.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      # Signature avec la clé fixe (secrets du dépôt)
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get
      - run: flutter build apk --release --dart-define=RG_BUILD=${{ github.run_number }}

      - name: Renommer l'APK avec la version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d '[:space:]')
          NOM="RadioGeniale-v${VERSION}-build${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "$NOM.apk"
          cp build/app/outputs/flutter-apk/app-release.apk RadioGeniale.apk
          echo "NOM_APK=$NOM" >> "$GITHUB_ENV"
          echo "VERSION_APP=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOM_APK }}
          path: ${{ env.NOM_APK }}.apk

      # Publication publique (lien fixe vers la dernière version), uniquement
      # quand le numéro de version de l'appli change, et seulement si l'APK
      # est signé avec la clé fixe.
      - name: Vérifier si cette version est déjà publiée
        if: env.HAS_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION_APP}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "PUBLIER=false" >> "$GITHUB_ENV"
            echo "La version ${VERSION_APP} est déjà publiée : pas de nouvelle Release."
          else
            echo "PUBLIER=true" >> "$GITHUB_ENV"
          fi

      - name: Publier la Release
        if: env.HAS_KEYSTORE == 'true' && env.PUBLIER == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_APP }}
          name: Radio Géniale ${{ env.VERSION_APP }} (build ${{ github.run_number }})
          make_latest: true
          files: |
            RadioGeniale.apk
            ${{ env.NOM_APK }}.apk

  ios:
    name: iOS (vérification de compilation)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Le code du projet est fourni dans projet.zip (un seul fichier à
      # téléverser sur GitHub) : on le décompresse par-dessus le dépôt.
      - name: Décompresser projet.zip
        run: unzip -o -q projet.zip -d .

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - run: flutter pub get

      # Compilation sans signature : vérifie que l'appli iOS se construit.
      # Pour l'installer sur un iPhone, il faut la signer avec un compte
      # Apple Developer.
      - run: flutter build ios --release --no-codesign

      - name: Archiver Runner.app
        run: |
          cd build/ios/iphoneos
          zip -qr ../../../RadioGeniale-ios-non-signe.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: RadioGeniale-ios-non-signe
          path: RadioGeniale-ios-non-signe.zip
