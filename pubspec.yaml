name: vdo_ninja
description: "Radio Géniale – application correspondant (micro en direct via VDO.Ninja). Fork de vdon_flutter (GPL-3.0)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Moteur WebRTC natif (micro conservé en arrière-plan, contrairement à une WebView)
  flutter_webrtc: ^1.2.0
  # Utilisés par la signalisation VDO.Ninja (signaling.dart)
  crypto: ^3.0.6
  convert: ^3.0.0
  encrypt: ^5.0.1
  flutter_background: ^1.3.0
  # Autorisations micro / notifications
  permission_handler: ^12.0.1
  # Récupération des serveurs TURN de vdo.ninja
  http: ^1.3.0
  # Mémorise le nom du correspondant
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  win32: ^5.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
